name: Release

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local

jobs:
  validate-release:
    name: Validate release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require a semantic version tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be a semantic version such as v0.6.0 or v0.6.0-rc.1"
            exit 1
          fi

  release-binaries:
    name: Binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Build and package binary
        id: package
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          asset_base="ja3proxy-${RELEASE_TAG}-${GOOS}-${GOARCH}"
          mkdir -p dist/package

          binary="dist/package/ja3proxy"
          if [[ "$GOOS" == "windows" ]]; then
            binary="${binary}.exe"
          fi

          go build -trimpath -ldflags="-s -w" -o "$binary" ./cmd/ja3proxy

          if [[ "$GOOS" == "windows" ]]; then
            archive="${asset_base}.zip"
            archive_path="$PWD/dist/${archive}"
            (cd dist/package && zip -q "$archive_path" "$(basename "$binary")")
          else
            archive="${asset_base}.tar.gz"
            archive_path="$PWD/dist/${archive}"
            tar -C dist/package -czf "$archive_path" "$(basename "$binary")"
          fi

          (cd dist && sha256sum "$archive" > "${archive}.sha256")
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/$ARCHIVE" \
            "dist/$ARCHIVE.sha256" \
            --clobber
