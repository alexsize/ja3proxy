name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Show Go version
        run: go version

      - name: Download and verify modules
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'The following files need gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Check module tidiness
        if: runner.os == 'Linux'
        run: go mod tidy -diff

      - name: Build
        run: go build -trimpath -v ./...

      - name: Vet
        run: go vet ./...

      - name: Check uTLS profile baseline
        run: go test ./internal/ja3proxy/tlsprofile -run '^TestUTLSProfileBaseline$' -count=1 -v

      - name: Check uTLS outbound wire baseline
        run: go test ./internal/ja3proxy/e2e -run '^TestRecorderOutboundWireThroughProxyMatrix$' -count=1 -v

      - name: Test
        run: go test -count=1 -v ./...

      - name: Test with race detector
        if: runner.os == 'Linux'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      - name: Check known vulnerabilities
        if: runner.os == 'Linux'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
